# M1 stack: Postgres, MediaMTX (the playout's receiver), the upload API and the
# playout supervisor. Set SR_STATIC_TOKEN (the M1 device token) first:
#   SR_STATIC_TOKEN=$(openssl rand -hex 32) docker compose up -d --build --wait
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: streamrelay
      POSTGRES_PASSWORD: ${SR_DB_PASSWORD:-streamrelay}
      POSTGRES_DB: streamrelay
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "streamrelay"]
      interval: 2s
      retries: 30

  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    volumes: [./deploy/mediamtx.yml:/mediamtx.yml:ro]
    ports: ["127.0.0.1:1935:1935"]

  api:
    build: .
    command: streamrelay-api
    environment: &env
      SR_DATABASE_URL: postgresql://streamrelay:${SR_DB_PASSWORD:-streamrelay}@postgres:5432/streamrelay
      SR_STATIC_TOKEN: ${SR_STATIC_TOKEN:?set SR_STATIC_TOKEN}
      SR_RTMP_URL_TEMPLATE: rtmp://mediamtx:1935/live/{broadcast_id}
    volumes: [store:/data]
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health')"]
      interval: 2s
      retries: 30

  playout:
    build: .
    command: streamrelay-playout
    environment: *env
    volumes: [store:/data:ro]
    depends_on:
      api: {condition: service_healthy}     # the API applies migrations and runs the startup scan
      mediamtx: {condition: service_started}

volumes:
  pgdata:
  store:
