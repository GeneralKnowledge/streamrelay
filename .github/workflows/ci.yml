name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: ruff check services tests tools
      - run: mypy

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    env:
      PGPASSWORD: postgres
      SR_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - name: SQL tests (cross-account isolation)
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE sqltest"
          psql -h 127.0.0.1 -U postgres -d sqltest -v ON_ERROR_STOP=1 -f docs/architecture/schema.sql -f tests/sql/cross_account.sql
      - run: pytest -q

  continuity-smoke:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    env:
      SR_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core postgresql-client
      - name: MediaMTX
        run: |
          curl -sSL https://github.com/bluenviron/mediamtx/releases/download/v1.9.3/mediamtx_v1.9.3_linux_amd64.tar.gz | tar xz mediamtx
          sudo mv mediamtx /usr/local/bin/
      - run: pip install -e ".[dev]"
      - run: tests/media-continuity/smoke.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-run
          path: |
            data/smoke-run/*.log
            data/smoke-run/*.jsonl
            data/smoke-run/verify.*

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up
        env: {SR_STATIC_TOKEN: ci-token}
        run: docker compose up -d --build --wait
      - name: API answers through Compose
        run: |
          curl -sf http://127.0.0.1:8080/v1/health
          curl -sf -X POST http://127.0.0.1:8080/v1/broadcasts -H "Authorization: Bearer ci-token" \
            -H "Content-Type: application/json" \
            -d '{"title":"ci","client_broadcast_ref":"00000000-0000-4000-8000-000000000001","catch_up":{"mode":"skip_to_live"}}'
          sleep 5
          docker compose logs playout | tail -20
          docker compose logs mediamtx | grep -q "is publishing to path 'live/"
      - if: always()
        run: docker compose logs --no-color | tail -100
