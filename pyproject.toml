[project]
name = "streamrelay"
version = "0.1.0"
description = "StreamRelay server: segment upload API and continuous playout"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "av>=14",
    "numpy>=2",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
streamrelay-api = "streamrelay.api.main:run"
streamrelay-playout = "streamrelay.playout.supervisor:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "services"

[tool.setuptools.packages.find]
where = ["services"]

[tool.setuptools.package-data]
streamrelay = ["migrations/*.sql", "playout/*.ttf"]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
files = ["services/streamrelay"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.ruff.lint.isort]
known-first-party = ["streamrelay"]
